name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build Universal GMS Stable Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Upload APK to Public Distribution Repo
        env:
          # This PAT must have `repo` scope on AryaVLcom/A.R.S.A-Audio-Resonant-Streaming-Architecture-
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          mv "$APK_PATH" "arsa-${TAG}.apk"

          # Ensure the release exists in the distribution repo, then upload
          gh release view "$TAG" --repo "AryaVLcom/A.R.S.A-Audio-Resonant-Streaming-Architecture-" \
            || gh release create "$TAG" --repo "AryaVLcom/A.R.S.A-Audio-Resonant-Streaming-Architecture-" \
               --title "ARSA ${TAG}" \
               --notes "ARSA ${TAG} — Universal APK release."

          gh release upload "$TAG" "arsa-${TAG}.apk" \
            --repo "AryaVLcom/A.R.S.A-Audio-Resonant-Streaming-Architecture-" \
            --clobber
